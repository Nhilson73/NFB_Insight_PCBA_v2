# Gate PR17: reconstrucción semántica KiCad + ECOs de placement vigentes.
name: PR17 placement KiCad

on:
  push:
    branches: [agent/pr17-production-placement]
  pull_request:
    branches: [main]
    paths:
      - 'tools/probe_placement_footprints.py'
      - 'tools/probe_pcbnew_api.py'
      - 'tools/compute_placement_plan.py'
      - 'tools/generate_pr17_placement_manifest.py'
      - 'tools/apply_z3_buck_placement_eco.py'
      - 'tools/apply_z2_loadcell_tp_eco.py'
      - 'tools/materialize_pr17_pcb.py'
      - 'tools/validate_pr17_placement.py'
      - 'tools/validate_pr17_drc.py'
      - 'hardware/placement_manifest.json'
      - 'hardware/placement_drc_contract.json'
      - 'hardware/z3_buck_placement_eco.json'
      - 'hardware/z2_loadcell_tp_placement_eco.json'
      - 'kicad/NFB_Insight_PCBA_v2.kicad_pcb'
      - '.github/workflows/pr17-pcbnew-probe.yml'

permissions: {contents: read}

jobs:
  placement:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0.5
      options: --user root
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Preparar git y KiCad
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p "$HOME/.config/kicad/10.0"
          cp /usr/share/kicad/template/sym-lib-table "$HOME/.config/kicad/10.0/sym-lib-table"
          cp /usr/share/kicad/template/fp-lib-table "$HOME/.config/kicad/10.0/fp-lib-table"
      - name: Compilar herramientas
        run: |
          python3 -m py_compile tools/probe_placement_footprints.py tools/probe_pcbnew_api.py tools/compute_placement_plan.py tools/generate_pr17_placement_manifest.py tools/apply_z3_buck_placement_eco.py tools/apply_z2_loadcell_tp_eco.py tools/materialize_pr17_pcb.py tools/validate_pr17_placement.py tools/validate_pr17_drc.py tools/validate_z1_production.py
      - name: Validaciones previas
        run: |
          python3 tools/probe_placement_footprints.py
          python3 tools/validate_z1_production.py
          python3 tools/probe_pcbnew_api.py
          python3 tools/compute_placement_plan.py
      - name: Regenerar manifest PR17 + ECOs vigentes
        run: |
          python3 tools/generate_pr17_placement_manifest.py
          python3 tools/apply_z3_buck_placement_eco.py
          python3 tools/apply_z2_loadcell_tp_eco.py
      - name: Verificar JSON reproducibles
        run: git diff --exit-code -- hardware/placement_manifest.json hardware/placement_plan_probe.json
      - name: Materializar y validar PCB
        run: |
          python3 tools/materialize_pr17_pcb.py
          python3 tools/validate_pr17_placement.py
      - name: DRC placement exacto
        run: |
          kicad-cli pcb drc kicad/NFB_Insight_PCBA_v2.kicad_pcb --format json --output /tmp/pr17_drc.json --severity-all
          python3 tools/validate_pr17_drc.py /tmp/pr17_drc.json
      - name: Resumen
        run: |
          python3 -c "import json; p=json.load(open('hardware/placement_manifest.json')); print('BOARD',p['board']); print('REFS',len(p['placements'])); print('ECO',p.get('eco_revisions',[]))"
          echo "Equivalencia PCB semántica; UUID pcbnew no es byte-estable."
