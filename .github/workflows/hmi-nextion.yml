name: HMI Nextion NX8048P050

on:
  pull_request:
    branches: [main]
    paths:
      - 'hardware/hmi_system_contract.json'
      - 'hardware/hmi_power_eco.json'
      - 'hardware/z2_digital_contract.json'
      - 'hardware/z2_production_netlist.json'
      - 'hardware/power_architecture_contract.json'
      - 'hardware/pr19d_hmi_power_routing_manifest.json'
      - 'bom/insight_hmi_system_bom.csv'
      - 'bom/insight_z2_production_bom.csv'
      - 'kicad/lib/nfb_footprints.pretty/Nextion_NX8048P050_011C_Y_Enclosure.kicad_mod'
      - 'kicad/lib/nfb_footprints.pretty/Nextion_SDExtender_External.kicad_mod'
      - 'kicad/lib/nfb_footprints.pretty/Nextion_BOX_Speaker_External.kicad_mod'
      - 'kicad/lib/nfb_footprints.pretty/Nextion_Foca_Max_Service.kicad_mod'
      - 'kicad/lib/nfb_footprints.pretty/RECOM_R78K5_0_2_0L_External.kicad_mod'
      - 'docs/HMI_NEXTION_NX8048P050.md'
      - 'docs/HMI_POWER_ECO_PR19D.md'
      - 'README.md'
      - 'tools/validate_hmi_system.py'
      - 'tools/validate_hmi_power_eco.py'
      - '.github/workflows/hmi-nextion.yml'

permissions:
  contents: read

jobs:
  validate-read-only:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0.5
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Preparar KiCad
        run: |
          mkdir -p "$HOME/.config/kicad/10.0"
          cp /usr/share/kicad/template/sym-lib-table "$HOME/.config/kicad/10.0/sym-lib-table"
          cp /usr/share/kicad/template/fp-lib-table "$HOME/.config/kicad/10.0/fp-lib-table"
      - name: Gate HMI + Z2
        run: |
          python3 tools/validate_hmi_system.py
          python3 tools/validate_z2_production.py
      - name: Huellas mecánicas externas
        run: |
          python3 - <<'PY'
          import pcbnew
          names=['Nextion_NX8048P050_011C_Y_Enclosure','Nextion_SDExtender_External','Nextion_BOX_Speaker_External','Nextion_Foca_Max_Service','RECOM_R78K5_0_2_0L_External']
          for name in names:
              fp=pcbnew.FootprintLoad('kicad/lib/nfb_footprints.pretty',name)
              if fp is None or len(list(fp.Pads()))!=0: raise SystemExit(f'huella externa inválida {name}')
              print('OK footprint',name)
          PY
      - name: DRC + gate PR19D
        run: |
          kicad-cli pcb drc kicad/NFB_Insight_PCBA_v2.kicad_pcb --format json --output /tmp/hmi_drc.json --severity-all
          python3 tools/validate_hmi_power_eco.py /tmp/hmi_drc.json
