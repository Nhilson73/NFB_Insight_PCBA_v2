name: Validación Z2 digital Insight

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  z2:
    name: Contrato, BOM, netlist y ERC Z2
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0.5
      options: --user root
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Validar producción Z2
        run: python3 tools/validate_z2_production.py
      - name: Inicializar KiCad
        run: |
          mkdir -p "$HOME/.config/kicad/10.0"
          cp /usr/share/kicad/template/sym-lib-table "$HOME/.config/kicad/10.0/sym-lib-table"
          cp /usr/share/kicad/template/fp-lib-table "$HOME/.config/kicad/10.0/fp-lib-table"
      - name: Ejecutar ERC Z2
        run: kicad-cli sch erc kicad/z2_digital_contract.kicad_sch --output /tmp/erc_z2_pr7.rpt --severity-all --exit-code-violations
      - name: Mostrar ERC Z2
        if: always()
        run: test ! -f /tmp/erc_z2_pr7.rpt || cat /tmp/erc_z2_pr7.rpt
