name: PR17 DRC CLI probe

on:
  push:
    branches: [agent/pr17-production-placement]
    paths:
      - '.github/workflows/pr17-pcbnew-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0.5
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Confirmar ausencia pcbnew Python
        continue-on-error: true
        run: python3 -c 'import pcbnew; print(pcbnew.GetBuildVersion())'
      - name: Probe DRC CLI options
        run: kicad-cli pcb drc --help
      - name: Probe PCB CLI
        run: kicad-cli pcb --help
