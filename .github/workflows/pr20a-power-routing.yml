name: PR20A power routing
on:
  push:
    branches: [agent/pr20a-power-routing]
    paths:
      - 'tools/probe_pr20a_co2_window.py'
      - '.github/workflows/pr20a-power-routing.yml'
permissions:
  contents: read
jobs:
  co2-window:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0.5
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Mapear ventana B.Cu/In2/F.Cu CO2
        run: python3 tools/probe_pr20a_co2_window.py
