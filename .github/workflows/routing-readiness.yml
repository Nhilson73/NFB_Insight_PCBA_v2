name: PR18 routing readiness

on:
  push:
    branches: [agent/pr18-routing-readiness]
    paths:
      - 'hardware/routing_contract.json'
      - 'hardware/routing_batches_contract.json'
      - 'hardware/pr19a_local_routing_manifest.json'
      - 'hardware/pr19b_analog_routing_manifest.json'
      - 'hardware/pr19c_digital_routing_manifest.json'
      - 'hardware/pr19d_hmi_power_routing_manifest.json'
      - 'hardware/power_netclasses.json'
      - 'hardware/placement_manifest.json'
      - 'hardware/z1_production_netlist.json'
      - 'hardware/z2_production_netlist.json'
      - 'hardware/power_production_netlist.json'
      - 'hardware/z4_production_netlist.json'
      - 'kicad/NFB_Insight_PCBA_v2.kicad_pcb'
      - 'kicad/NFB_Insight_PCBA_v2.kicad_dru'
      - 'tools/validate_routing_contract.py'
      - 'tools/validate_routing_phase.py'
      - 'tools/validate_pr17_placement.py'
      - 'tools/validate_pr17_drc.py'
      - 'tools/validate_pr19a_local.py'
      - 'tools/validate_pr19b_analog.py'
      - 'tools/validate_pr19c_digital.py'
      - 'tools/validate_hmi_power_eco.py'
      - '.github/workflows/routing-readiness.yml'
  pull_request:
    branches: [main]
    paths:
      - 'hardware/routing_contract.json'
      - 'hardware/routing_batches_contract.json'
      - 'hardware/pr19a_local_routing_manifest.json'
      - 'hardware/pr19b_analog_routing_manifest.json'
      - 'hardware/pr19c_digital_routing_manifest.json'
      - 'hardware/pr19d_hmi_power_routing_manifest.json'
      - 'hardware/power_netclasses.json'
      - 'hardware/placement_manifest.json'
      - 'hardware/z1_production_netlist.json'
      - 'hardware/z2_production_netlist.json'
      - 'hardware/power_production_netlist.json'
      - 'hardware/z4_production_netlist.json'
      - 'kicad/NFB_Insight_PCBA_v2.kicad_pcb'
      - 'kicad/NFB_Insight_PCBA_v2.kicad_dru'
      - 'tools/validate_routing_contract.py'
      - 'tools/validate_routing_phase.py'
      - 'tools/validate_pr17_placement.py'
      - 'tools/validate_pr17_drc.py'
      - 'tools/validate_pr19a_local.py'
      - 'tools/validate_pr19b_analog.py'
      - 'tools/validate_pr19c_digital.py'
      - 'tools/validate_hmi_power_eco.py'
      - '.github/workflows/routing-readiness.yml'

permissions:
  contents: read

jobs:
  routing-readiness:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0.5
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Inicializar librerías KiCad
        run: |
          mkdir -p "$HOME/.config/kicad/10.0"
          cp /usr/share/kicad/template/sym-lib-table "$HOME/.config/kicad/10.0/sym-lib-table"
          cp /usr/share/kicad/template/fp-lib-table "$HOME/.config/kicad/10.0/fp-lib-table"
      - name: Compilar validadores
        run: |
          python3 -m py_compile tools/validate_routing_contract.py tools/validate_routing_phase.py tools/validate_pr17_placement.py tools/validate_pr17_drc.py
          python3 -m py_compile tools/validate_pr19a_local.py tools/validate_pr19b_analog.py tools/validate_pr19c_digital.py tools/validate_hmi_power_eco.py
      - name: Validar contrato de routing PR18/PR19D
        run: |
          python3 tools/validate_routing_batches.py
          python3 tools/validate_routing_contract.py
      - name: Revalidar estado físico según fase
        run: |
          normalize_placement() {
            python3 - <<'PY'
          import json
          p='hardware/placement_manifest.json'
          d=json.load(open(p,encoding='utf-8'))
          for x in d['placements']:
              r=((float(x['rotation_deg'])+180.0)%360.0)-180.0
              if abs(r+180.0) < 1e-9: r=180.0
              x['rotation_deg']=r
          with open(p,'w',encoding='utf-8') as f:
              json.dump(d,f,indent=2,ensure_ascii=False); f.write('\n')
          PY
          }
          kicad-cli pcb drc kicad/NFB_Insight_PCBA_v2.kicad_pcb --format json --output /tmp/pr18_drc.json --severity-all
          normalize_placement
          if [ -f hardware/pr19d_hmi_power_routing_manifest.json ]; then
            python3 tools/validate_hmi_power_eco.py /tmp/pr18_drc.json
          elif [ -f hardware/pr19c_digital_routing_manifest.json ]; then
            python3 tools/validate_pr19c_digital.py /tmp/pr18_drc.json
          elif [ -f hardware/pr19b_analog_routing_manifest.json ]; then
            python3 tools/validate_pr19b_analog.py /tmp/pr18_drc.json
          elif [ -f hardware/pr19a_local_routing_manifest.json ]; then
            python3 tools/validate_pr19a_local.py /tmp/pr18_drc.json
          else
            python3 tools/validate_pr17_placement.py
            python3 tools/validate_pr17_drc.py /tmp/pr18_drc.json
          fi
