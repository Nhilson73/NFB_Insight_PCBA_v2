name: PR19A persistido + staging PR19B analógico

on:
  pull_request:
    branches: [main]
    paths:
      - 'kicad/NFB_Insight_PCBA_v2.kicad_pcb'
      - 'kicad/NFB_Insight_PCBA_v2.kicad_dru'
      - 'hardware/pr19a_local_routing_manifest.json'
      - 'hardware/pr19a_local_probe.json'
      - 'hardware/pr19b_analog_routing_manifest.json'
      - 'hardware/pr19b_analog_probe.json'
      - 'hardware/routing_batches_contract.json'
      - 'hardware/routing_contract.json'
      - 'hardware/placement_manifest.json'
      - 'hardware/placement_drc_contract.json'
      - 'tools/validate_pr19a_local.py'
      - 'tools/probe_pr19b_analog.py'
      - 'tools/materialize_pr19b_analog.py'
      - '.github/workflows/pr23-pr19a-local-routing.yml'

permissions:
  contents: write

jobs:
  pr19a-persistido:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0.5
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Inicializar librerías KiCad
        run: |
          mkdir -p "$HOME/.config/kicad/10.0"
          cp /usr/share/kicad/template/sym-lib-table "$HOME/.config/kicad/10.0/sym-lib-table"
          cp /usr/share/kicad/template/fp-lib-table "$HOME/.config/kicad/10.0/fp-lib-table"
      - name: Validar partición 28+4+16+10+1
        run: python3 tools/validate_routing_batches.py
      - name: DRC checkpoint PR19A de entrada
        run: kicad-cli pcb drc kicad/NFB_Insight_PCBA_v2.kicad_pcb --format json --output /tmp/pr19a_drc.json --severity-all
      - name: Normalizar representación angular para gate legado
        run: |
          python3 - <<'PY'
          import json
          p='hardware/placement_manifest.json'; d=json.load(open(p,encoding='utf-8'))
          for x in d['placements']:
              r=((float(x['rotation_deg'])+180.0)%360.0)-180.0
              if abs(r+180.0)<1e-9: r=180.0
              x['rotation_deg']=r
          with open(p,'w',encoding='utf-8') as f: json.dump(d,f,indent=2,ensure_ascii=False); f.write('\n')
          PY
      - name: Exigir PR19A 28 de 28 intacto
        run: python3 tools/validate_pr19a_local.py /tmp/pr19a_drc.json

  staging-pr19b:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0.5
      options: --user root
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Detectar checkpoint ya persistido
        id: state
        run: |
          if git ls-tree -r HEAD --name-only | grep -qx 'hardware/pr19b_analog_routing_manifest.json'; then
            echo 'persisted=true' >> "$GITHUB_OUTPUT"
          else
            echo 'persisted=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Inicializar librerías KiCad
        if: steps.state.outputs.persisted == 'false'
        run: |
          mkdir -p "$HOME/.config/kicad/10.0"
          cp /usr/share/kicad/template/sym-lib-table "$HOME/.config/kicad/10.0/sym-lib-table"
          cp /usr/share/kicad/template/fp-lib-table "$HOME/.config/kicad/10.0/fp-lib-table"
      - name: Probar baseline PR19A
        if: steps.state.outputs.persisted == 'false'
        run: python3 tools/probe_pr19b_analog.py
      - name: Materializar candidato PR19B
        if: steps.state.outputs.persisted == 'false'
        run: python3 tools/materialize_pr19b_analog.py
      - name: DRC KiCad 10.0.5
        if: steps.state.outputs.persisted == 'false'
        run: kicad-cli pcb drc kicad/NFB_Insight_PCBA_v2.kicad_pcb --format json --output /tmp/pr19b_drc.json --severity-all
      - name: Exigir 4 de 4 antes de persistir
        if: steps.state.outputs.persisted == 'false'
        run: |
          python3 - <<'PY'
          import json,collections
          d=json.load(open('/tmp/pr19b_drc.json',encoding='utf-8'))
          m=json.load(open('hardware/pr19b_analog_routing_manifest.json',encoding='utf-8'))
          errors=[v for v in d.get('violations',[]) if v.get('severity')=='error']; assert not errors,errors[:10]
          assert len(d.get('unconnected_items',[]))==192,len(d.get('unconnected_items',[]))
          assert m['new_segment_count']==32 and m['new_via_count']==7
          counts=collections.Counter(v.get('type','?') for v in d.get('violations',[]))
          assert dict(counts)=={'silk_edge_clearance':13,'text_height':1,'silk_overlap':173,'silk_over_copper':68},dict(counts)
          print('OK staging PR19B: 4/4, DRC=0, sin deuda nueva')
          PY
      - name: Persistir checkpoint validado únicamente en la rama PR19B
        if: steps.state.outputs.persisted == 'false'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kicad/NFB_Insight_PCBA_v2.kicad_pcb hardware/pr19b_analog_routing_manifest.json hardware/pr19b_analog_probe.json
          git commit -m "routing: persistir PR19B 4/4 con DRC 0"
          git push origin HEAD:${GITHUB_HEAD_REF}
      - name: Checkpoint ya presente
        if: steps.state.outputs.persisted == 'true'
        run: echo 'PR19B ya está persistido; staging sin acción.'
