name: Validación interfaces de sensores Insight

on:
  push:
    branches: [main]
    paths:
      - 'hardware/sensor_interface_contract.json'
      - 'hardware/z1_production_netlist.json'
      - 'hardware/insight_pin_contract.json'
      - 'tools/validate_sensor_interfaces.py'
      - 'kicad/z1_sensor_contract.kicad_sch'
      - '.github/workflows/sensor-interface.yml'
  pull_request:
    branches: [main]
    paths:
      - 'hardware/sensor_interface_contract.json'
      - 'hardware/z1_production_netlist.json'
      - 'hardware/insight_pin_contract.json'
      - 'tools/validate_sensor_interfaces.py'
      - 'kicad/z1_sensor_contract.kicad_sch'
      - '.github/workflows/sensor-interface.yml'

jobs:
  sensors:
    name: Contrato real de sensores PR6 y ERC Z1
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0.5
      options: --user root
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Validar interfaces
        run: python3 tools/validate_sensor_interfaces.py
      - name: Inicializar librerías globales KiCad
        run: |
          mkdir -p "$HOME/.config/kicad/10.0"
          cp /usr/share/kicad/template/sym-lib-table "$HOME/.config/kicad/10.0/sym-lib-table"
          cp /usr/share/kicad/template/fp-lib-table "$HOME/.config/kicad/10.0/fp-lib-table"
      - name: Ejecutar ERC Z1 separado
        run: kicad-cli sch erc kicad/z1_sensor_contract.kicad_sch --output /tmp/erc_sensor.rpt --severity-all --exit-code-violations
      - name: Mostrar ERC
        if: always()
        run: test ! -f /tmp/erc_sensor.rpt || cat /tmp/erc_sensor.rpt
