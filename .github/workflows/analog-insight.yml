name: Validación analógica Insight

on:
  push:
    branches: [main]
    paths:
      - 'hardware/analog_insight_manifest.json'
      - 'hardware/sensor_interface_contract.json'
      - 'bom/insight_analog_inheritance.csv'
      - 'bom/insight_z1_production_bom.csv'
      - 'kicad/analog_insight.kicad_sch'
      - 'tools/validate_analog_manifest.py'
      - '.github/workflows/analog-insight.yml'
  pull_request:
    branches: [main]
    paths:
      - 'hardware/analog_insight_manifest.json'
      - 'hardware/sensor_interface_contract.json'
      - 'bom/insight_analog_inheritance.csv'
      - 'bom/insight_z1_production_bom.csv'
      - 'kicad/analog_insight.kicad_sch'
      - 'tools/validate_analog_manifest.py'
      - '.github/workflows/analog-insight.yml'

jobs:
  analog:
    name: Trazabilidad PR4 frente a baseline PR6
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0.5
      options: --user root
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Validar trazabilidad
        run: python3 tools/validate_analog_manifest.py
      - name: Inicializar librerías globales KiCad
        run: |
          mkdir -p "$HOME/.config/kicad/10.0"
          cp /usr/share/kicad/template/sym-lib-table "$HOME/.config/kicad/10.0/sym-lib-table"
          cp /usr/share/kicad/template/fp-lib-table "$HOME/.config/kicad/10.0/fp-lib-table"
      - name: Ejecutar ERC de hoja histórica
        run: |
          kicad-cli sch erc kicad/analog_insight.kicad_sch --output /tmp/erc_analog_history.rpt --severity-all --exit-code-violations
      - name: Mostrar ERC
        if: always()
        run: test ! -f /tmp/erc_analog_history.rpt || cat /tmp/erc_analog_history.rpt
