name: Validación footprints críticos e integración

on:
  pull_request:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/FOOTPRINT_AUDIT.md'
      - 'docs/FASE3_PR13_FOOTPRINT_CLOSURE.md'
      - 'docs/ROADMAP.md'
      - 'hardware/footprint_audit.json'
      - 'hardware/electrical_integration_contract.json'
      - 'hardware/insight_pin_contract.json'
      - 'hardware/z1_production_netlist.json'
      - 'hardware/z2_production_netlist.json'
      - 'hardware/power_production_netlist.json'
      - 'hardware/z4_production_netlist.json'
      - 'hardware/routing_batches_contract.json'
      - 'hardware/pr19a_local_routing_manifest.json'
      - 'bom/insight_power_production_bom.csv'
      - 'bom/insight_z4_production_bom.csv'
      - 'kicad/integration_contract.kicad_sch'
      - 'kicad/lib/nfb_footprints.pretty/**'
      - 'kicad/NFB_Insight_PCBA_v2.kicad_pcb'
      - 'tools/validate_footprint_audit.py'
      - 'tools/validate_electrical_integration.py'
      - 'tools/validate_routing_phase.py'
      - 'tools/prepare_legacy_placement_view.py'
      - '.github/workflows/integration-footprints.yml'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/FOOTPRINT_AUDIT.md'
      - 'docs/FASE3_PR13_FOOTPRINT_CLOSURE.md'
      - 'docs/ROADMAP.md'
      - 'hardware/footprint_audit.json'
      - 'hardware/electrical_integration_contract.json'
      - 'hardware/insight_pin_contract.json'
      - 'hardware/z1_production_netlist.json'
      - 'hardware/z2_production_netlist.json'
      - 'hardware/power_production_netlist.json'
      - 'hardware/z4_production_netlist.json'
      - 'hardware/routing_batches_contract.json'
      - 'hardware/pr19a_local_routing_manifest.json'
      - 'bom/insight_power_production_bom.csv'
      - 'bom/insight_z4_production_bom.csv'
      - 'kicad/integration_contract.kicad_sch'
      - 'kicad/lib/nfb_footprints.pretty/**'
      - 'kicad/NFB_Insight_PCBA_v2.kicad_pcb'
      - 'tools/validate_footprint_audit.py'
      - 'tools/validate_electrical_integration.py'
      - 'tools/validate_routing_phase.py'
      - 'tools/prepare_legacy_placement_view.py'
      - '.github/workflows/integration-footprints.yml'

permissions:
  contents: read

jobs:
  audit-integration:
    name: Footprints críticos + coherencia Z1/Z2/Z3/Z4
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0.5
      options: --user root
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Validar fase de routing real antes de vista histórica
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from tools.validate_routing_phase import assert_authorized_phase
          text=Path('kicad/NFB_Insight_PCBA_v2.kicad_pcb').read_text(encoding='utf-8')
          print('FASE_REAL',assert_authorized_phase(text,'footprint audit'))
          PY
      - name: Preparar vista efímera placement-only PR13/PR17
        run: python3 tools/prepare_legacy_placement_view.py
      - name: Validar cierre de footprints PR13
        run: python3 tools/validate_footprint_audit.py
      - name: Validar integración eléctrica
        run: python3 tools/validate_electrical_integration.py
      - name: Inicializar librerías globales KiCad
        run: |
          mkdir -p "$HOME/.config/kicad/10.0"
          cp /usr/share/kicad/template/sym-lib-table "$HOME/.config/kicad/10.0/sym-lib-table"
          cp /usr/share/kicad/template/fp-lib-table "$HOME/.config/kicad/10.0/fp-lib-table"
      - name: Ejecutar ERC de hoja de integración
        run: kicad-cli sch erc kicad/integration_contract.kicad_sch --output /tmp/erc_integration_pr13.rpt --severity-all --exit-code-violations
      - name: Mostrar ERC integración
        if: always()
        run: test ! -f /tmp/erc_integration_pr13.rpt || cat /tmp/erc_integration_pr13.rpt
      - name: Guardar ERC integración
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erc-integration-pr13
          path: /tmp/erc_integration_pr13.rpt
