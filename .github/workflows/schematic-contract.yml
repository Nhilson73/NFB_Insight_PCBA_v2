name: Validación contrato esquemático Insight

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  contract:
    name: Contrato UNO Q + Z1/Z2/Z4 + root ERC
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0.5
      options: --user root
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Validar contrato Insight
        run: python3 tools/validate_schematic_contract.py
      - name: Inicializar librerías globales KiCad
        run: |
          mkdir -p "$HOME/.config/kicad/10.0"
          cp /usr/share/kicad/template/sym-lib-table "$HOME/.config/kicad/10.0/sym-lib-table"
          cp /usr/share/kicad/template/fp-lib-table "$HOME/.config/kicad/10.0/fp-lib-table"
      - name: Ejecutar ERC root PR14
        run: kicad-cli sch erc kicad/NFB_Insight_PCBA_v2.kicad_sch --output /tmp/erc_contract_root.rpt --severity-all --exit-code-violations
      - name: Ejecutar ERC contrato Z1
        run: kicad-cli sch erc kicad/z1_sensor_contract.kicad_sch --output /tmp/erc_contract_z1.rpt --severity-all --exit-code-violations
      - name: Ejecutar ERC contrato Z2
        run: kicad-cli sch erc kicad/z2_digital_contract.kicad_sch --output /tmp/erc_contract_z2.rpt --severity-all --exit-code-violations
      - name: Mostrar ERC
        if: always()
        run: |
          test ! -f /tmp/erc_contract_root.rpt || cat /tmp/erc_contract_root.rpt
          test ! -f /tmp/erc_contract_z1.rpt || cat /tmp/erc_contract_z1.rpt
          test ! -f /tmp/erc_contract_z2.rpt || cat /tmp/erc_contract_z2.rpt
