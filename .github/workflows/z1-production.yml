name: Validación Z1 producción

on:
  push:
    branches: [main]
    paths:
      - 'hardware/sensor_interface_contract.json'
      - 'hardware/z1_production_netlist.json'
      - 'hardware/insight_pin_contract.json'
      - 'hardware/power_architecture_contract.json'
      - 'bom/insight_z1_production_bom.csv'
      - 'kicad/NFB_Insight_PCBA_v2.kicad_sch'
      - 'kicad/lib/nfb_footprints.pretty/Honeywell_MPR_LongPort_12Pad.kicad_mod'
      - 'tools/validate_z1_production.py'
      - '.github/workflows/z1-production.yml'
  pull_request:
    branches: [main]
    paths:
      - 'hardware/sensor_interface_contract.json'
      - 'hardware/z1_production_netlist.json'
      - 'hardware/insight_pin_contract.json'
      - 'hardware/power_architecture_contract.json'
      - 'bom/insight_z1_production_bom.csv'
      - 'kicad/NFB_Insight_PCBA_v2.kicad_sch'
      - 'kicad/lib/nfb_footprints.pretty/Honeywell_MPR_LongPort_12Pad.kicad_mod'
      - 'tools/validate_z1_production.py'
      - '.github/workflows/z1-production.yml'

jobs:
  z1:
    name: Netlist, BOM, potencia y ERC Z1
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0.5
      options: --user root
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Validar contrato de producción Z1
        run: python3 tools/validate_z1_production.py
      - name: Inicializar librerías globales KiCad
        run: |
          mkdir -p "$HOME/.config/kicad/10.0"
          cp /usr/share/kicad/template/sym-lib-table "$HOME/.config/kicad/10.0/sym-lib-table"
          cp /usr/share/kicad/template/fp-lib-table "$HOME/.config/kicad/10.0/fp-lib-table"
      - name: Ejecutar ERC del esquemático Z1
        run: kicad-cli sch erc kicad/NFB_Insight_PCBA_v2.kicad_sch --output /tmp/erc_z1.rpt --severity-all --exit-code-violations
      - name: Mostrar ERC
        if: always()
        run: test ! -f /tmp/erc_z1.rpt || cat /tmp/erc_z1.rpt
      - name: Guardar ERC
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erc-z1
          path: /tmp/erc_z1.rpt
