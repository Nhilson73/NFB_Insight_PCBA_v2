name: PR19C candidato digital/control
on:
  pull_request:
    branches: [main]
    paths:
      - 'kicad/NFB_Insight_PCBA_v2.kicad_pcb'
      - 'hardware/pr19b_analog_routing_manifest.json'
      - 'hardware/routing_batches_contract.json'
      - 'hardware/routing_contract.json'
      - 'hardware/placement_manifest.json'
      - 'tools/materialize_pr19c_digital_v9.py'
      - 'tools/validate_pr19c_digital.py'
      - '.github/workflows/pr23-pr19a-local-routing.yml'
permissions:
  contents: read
jobs:
  pr19c-candidato:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0.5
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Preparar KiCad
        run: |
          mkdir -p "$HOME/.config/kicad/10.0"
          cp /usr/share/kicad/template/sym-lib-table "$HOME/.config/kicad/10.0/sym-lib-table"
          cp /usr/share/kicad/template/fp-lib-table "$HOME/.config/kicad/10.0/fp-lib-table"
      - name: Validar partición 28+4+16+10+1
        run: python3 tools/validate_routing_batches.py
      - name: Revalidar baseline PR19B
        run: |
          kicad-cli pcb drc kicad/NFB_Insight_PCBA_v2.kicad_pcb --format json --output /tmp/pr19c_baseline.json --severity-all
          python3 - <<'PY'
          import json
          p='hardware/placement_manifest.json'; d=json.load(open(p,encoding='utf-8'))
          for x in d['placements']:
              r=((float(x['rotation_deg'])+180.0)%360.0)-180.0
              if abs(r+180.0)<1e-9: r=180.0
              x['rotation_deg']=r
          with open(p,'w',encoding='utf-8') as f:
              json.dump(d,f,indent=2,ensure_ascii=False); f.write('\n')
          PY
          python3 tools/validate_pr19b_analog.py /tmp/pr19c_baseline.json
      - name: Materializar candidato PR19C v9
        run: python3 tools/materialize_pr19c_digital_v9.py
      - name: DRC KiCad 10.0.5 del candidato
        run: kicad-cli pcb drc kicad/NFB_Insight_PCBA_v2.kicad_pcb --format json --output /tmp/pr19c_candidate.json --severity-all
      - name: Resumir DRC
        run: |
          python3 - <<'PY'
          import json,collections
          d=json.load(open('/tmp/pr19c_candidate.json',encoding='utf-8'))
          sev=collections.Counter(v.get('severity') for v in d.get('violations',[]))
          typ=collections.Counter((v.get('severity'),v.get('type')) for v in d.get('violations',[]))
          print('DRC_SEVERITY',dict(sev)); print('UNCONNECTED',len(d.get('unconnected_items',[])))
          for k,n in sorted(typ.items(),key=lambda x:(str(x[0][0]),str(x[0][1]))): print('DRC_TYPE',k,n)
          PY
      - name: Gate acumulativo candidato
        run: python3 tools/validate_pr19c_digital.py /tmp/pr19c_candidate.json
      - name: Publicar candidato read-only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr19c-candidate
          path: |
            kicad/NFB_Insight_PCBA_v2.kicad_pcb
            hardware/pr19c_digital_routing_manifest.json
            /tmp/pr19c_candidate.json
          if-no-files-found: ignore
