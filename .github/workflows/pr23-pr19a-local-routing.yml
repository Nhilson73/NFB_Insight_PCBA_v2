name: PR19C staging controlado
on:
  pull_request:
    branches: [main]
    paths:
      - 'kicad/NFB_Insight_PCBA_v2.kicad_pcb'
      - 'hardware/pr19c_digital_routing_manifest.json'
      - 'hardware/pr19b_analog_routing_manifest.json'
      - 'hardware/routing_batches_contract.json'
      - 'hardware/placement_manifest.json'
      - 'tools/materialize_pr19c_digital_v18.py'
      - 'tools/validate_pr19c_digital.py'
      - '.github/workflows/pr23-pr19a-local-routing.yml'
permissions:
  contents: write
jobs:
  pr19c-staging:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0.5
      options: --user root
    steps:
      - name: Descargar rama PR19C
        uses: actions/checkout@v4
        with:
          ref: agent/pr19c-digital-control-routing
          fetch-depth: 1
      - name: Preparar KiCad
        run: |
          mkdir -p "$HOME/.config/kicad/10.0"
          cp /usr/share/kicad/template/sym-lib-table "$HOME/.config/kicad/10.0/sym-lib-table"
          cp /usr/share/kicad/template/fp-lib-table "$HOME/.config/kicad/10.0/fp-lib-table"
      - name: Compilar gates
        run: |
          python3 -m py_compile tools/materialize_pr19c_digital_v18.py
          python3 -m py_compile tools/validate_pr19c_digital.py
          python3 -m py_compile tools/validate_routing_phase.py
      - name: Validar partición
        run: python3 tools/validate_routing_batches.py
      - name: Materializar v18 si aún no está persistido
        run: |
          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path('hardware/pr19c_digital_routing_manifest.json')
          production=False
          if p.exists():
              try:
                  production=json.loads(p.read_text(encoding='utf-8')).get('status')=='DIGITAL_ROUTING_PR19C'
              except Exception:
                  pass
          pathlib.Path('/tmp/pr19c_already_production').write_text('1' if production else '0')
          PY
          if [ "$(cat /tmp/pr19c_already_production)" = "0" ]; then
            kicad-cli pcb drc kicad/NFB_Insight_PCBA_v2.kicad_pcb --format json --output /tmp/pr19c_baseline.json --severity-all
            python3 - <<'PY'
          import json
          p='hardware/placement_manifest.json'; d=json.load(open(p,encoding='utf-8'))
          for x in d['placements']:
              r=((float(x['rotation_deg'])+180.0)%360.0)-180.0
              if abs(r+180.0)<1e-9: r=180.0
              x['rotation_deg']=r
          with open(p,'w',encoding='utf-8') as f:
              json.dump(d,f,indent=2,ensure_ascii=False); f.write('\n')
          PY
            python3 tools/validate_pr19b_analog.py /tmp/pr19c_baseline.json
            git checkout -- hardware/placement_manifest.json
            python3 tools/materialize_pr19c_digital_v18.py
            python3 - <<'PY'
          import json
          p='hardware/pr19c_digital_routing_manifest.json'
          d=json.load(open(p,encoding='utf-8'))
          if d.get('new_segment_count')!=362 or d.get('new_via_count')!=88:
              raise SystemExit('conteos v18 inesperados')
          d['status']='DIGITAL_ROUTING_PR19C'
          with open(p,'w',encoding='utf-8') as f:
              json.dump(d,f,indent=2,ensure_ascii=False); f.write('\n')
          PY
          fi
      - name: DRC y gate del PCB a persistir
        run: |
          kicad-cli pcb drc kicad/NFB_Insight_PCBA_v2.kicad_pcb --format json --output /tmp/pr19c_final.json --severity-all
          python3 - <<'PY'
          import json
          p='hardware/placement_manifest.json'; d=json.load(open(p,encoding='utf-8'))
          for x in d['placements']:
              r=((float(x['rotation_deg'])+180.0)%360.0)-180.0
              if abs(r+180.0)<1e-9: r=180.0
              x['rotation_deg']=r
          with open(p,'w',encoding='utf-8') as f:
              json.dump(d,f,indent=2,ensure_ascii=False); f.write('\n')
          PY
          python3 tools/validate_pr19c_digital.py /tmp/pr19c_final.json
          git checkout -- hardware/placement_manifest.json
      - name: Persistir únicamente PCB y manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kicad/NFB_Insight_PCBA_v2.kicad_pcb hardware/pr19c_digital_routing_manifest.json
          if git diff --cached --quiet; then
            echo "Checkpoint PR19C ya persistido; sin cambios."
          else
            git commit -m "routing: persistir checkpoint PR19C 16/16 DRC=0"
            git push origin HEAD:agent/pr19c-digital-control-routing
          fi
