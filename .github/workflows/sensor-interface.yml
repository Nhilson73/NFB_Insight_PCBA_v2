name: Validación interfaces de sensores Insight

on:
  push:
    branches: [main]
    paths:
      - 'hardware/sensor_interface_contract.json'
      - 'hardware/insight_pin_contract.json'
      - 'bom/insight_sensor_interface_bom.csv'
      - 'docs/FASE2_PR5_SENSOR_INTERFACES.md'
      - 'kicad/NFB_Insight_PCBA_v2.kicad_sch'
      - 'tools/validate_sensor_interfaces.py'
      - '.github/workflows/sensor-interface.yml'
  pull_request:
    branches: [main]
    paths:
      - 'hardware/sensor_interface_contract.json'
      - 'hardware/insight_pin_contract.json'
      - 'bom/insight_sensor_interface_bom.csv'
      - 'docs/FASE2_PR5_SENSOR_INTERFACES.md'
      - 'kicad/NFB_Insight_PCBA_v2.kicad_sch'
      - 'tools/validate_sensor_interfaces.py'
      - '.github/workflows/sensor-interface.yml'

jobs:
  sensor-interface:
    name: Contrato eléctrico real y límites ADC
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0.5
      options: --user root

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Validar interfaces y escalamiento
        run: python3 tools/validate_sensor_interfaces.py

      - name: Inicializar librerías globales KiCad
        run: |
          mkdir -p "$HOME/.config/kicad/10.0"
          cp /usr/share/kicad/template/sym-lib-table "$HOME/.config/kicad/10.0/sym-lib-table"
          cp /usr/share/kicad/template/fp-lib-table "$HOME/.config/kicad/10.0/fp-lib-table"

      - name: Ejecutar ERC del contrato raíz
        run: |
          kicad-cli sch erc kicad/NFB_Insight_PCBA_v2.kicad_sch \
            --output /tmp/erc_sensor_contract.rpt \
            --severity-all \
            --exit-code-violations

      - name: Mostrar reporte ERC
        if: always()
        run: |
          if [ -f /tmp/erc_sensor_contract.rpt ]; then
            cat /tmp/erc_sensor_contract.rpt
          fi

      - name: Guardar reporte ERC
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erc-sensor-interface-pr5
          path: /tmp/erc_sensor_contract.rpt
