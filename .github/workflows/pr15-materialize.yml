name: PR15 materialización EDA

on:
  push:
    branches: [agent/pr15-production-symbol-materialization]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  materialize:
    name: Paridad JSON/BOM → KiCad + ERC cero
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0.5
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compilar herramientas PR15
        run: |
          python3 -m py_compile tools/generate_production_schematics.py
          python3 -m py_compile tools/normalize_pr15_schematics.py
          python3 -m py_compile tools/migrate_pr15_verified_footprints.py
          python3 -m py_compile tools/validate_root_eda.py

      - name: Exigir migraciones físicas ya aplicadas
        run: python3 tools/migrate_pr15_verified_footprints.py --check

      - name: Exigir reproducción determinista JSON/BOM → KiCad
        run: python3 tools/normalize_pr15_schematics.py --check

      - name: Validar contrato root PR15
        run: python3 tools/validate_root_eda.py

      - name: Inicializar librerías globales KiCad
        run: |
          mkdir -p "$HOME/.config/kicad/10.0"
          cp /usr/share/kicad/template/sym-lib-table "$HOME/.config/kicad/10.0/sym-lib-table"
          cp /usr/share/kicad/template/fp-lib-table "$HOME/.config/kicad/10.0/fp-lib-table"

      - name: Exigir ERC hierarchy completo igual a cero
        run: |
          kicad-cli sch erc kicad/NFB_Insight_PCBA_v2.kicad_sch \
            --output /tmp/root_pr15.rpt \
            --severity-all \
            --exit-code-violations

      - name: Mostrar ERC PR15
        if: always()
        run: test ! -f /tmp/root_pr15.rpt || cat /tmp/root_pr15.rpt

      - name: Guardar ERC PR15
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erc-pr15-${{ github.sha }}
          path: /tmp/root_pr15.rpt
          if-no-files-found: ignore
