name: PR27 validación final routing PR19A

on:
  push:
    branches: [agent/pr23-pr19a-local-routing]
  pull_request:
    branches: [main]
    paths:
      - 'kicad/NFB_Insight_PCBA_v2.kicad_pcb'
      - 'kicad/NFB_Insight_PCBA_v2.kicad_dru'
      - 'hardware/pr19a_local_routing_manifest.json'
      - 'hardware/pr19a_local_probe.json'
      - 'hardware/routing_contract.json'
      - 'hardware/routing_batches_contract.json'
      - 'hardware/placement_manifest.json'
      - 'hardware/placement_drc_contract.json'
      - 'tools/validate_pr19a_local.py'
      - '.github/workflows/pr27-persist-final.yml'

permissions:
  contents: read

jobs:
  validate-final:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0.5
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Inicializar librerías KiCad
        run: |
          mkdir -p "$HOME/.config/kicad/10.0"
          cp /usr/share/kicad/template/sym-lib-table "$HOME/.config/kicad/10.0/sym-lib-table"
          cp /usr/share/kicad/template/fp-lib-table "$HOME/.config/kicad/10.0/fp-lib-table"
      - name: Validar partición de routing
        run: python3 tools/validate_routing_batches.py
      - name: Ejecutar DRC sobre PCB persistido
        run: |
          kicad-cli pcb drc kicad/NFB_Insight_PCBA_v2.kicad_pcb --format json --output /tmp/pr27_final_drc.json --severity-all
      - name: Exigir PR19A final 28/28
        run: python3 tools/validate_pr19a_local.py /tmp/pr27_final_drc.json
      - name: Exigir métricas congeladas del checkpoint
        run: |
          python3 - <<'PY'
          import json
          m=json.load(open('hardware/pr19a_local_routing_manifest.json',encoding='utf-8'))
          d=json.load(open('/tmp/pr27_final_drc.json',encoding='utf-8'))
          assert len(m['routed_nets']) == 28, len(m['routed_nets'])
          assert len(m['deferred_nets']) == 31, len(m['deferred_nets'])
          assert len(m['segments']) == 523, len(m['segments'])
          assert len(m['vias']) == 24, len(m['vias'])
          assert not [v for v in d.get('violations',[]) if v.get('severity') == 'error']
          assert len(d.get('unconnected_items',[])) == 204, len(d.get('unconnected_items',[]))
          print('OK: PR19A persistido = 28/28, 523 segmentos, 24 vias, DRC errors=0, unconnected=204')
          PY
