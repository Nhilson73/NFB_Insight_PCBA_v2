name: HMI Power ECO

on:
  push:
    branches: [agent/hmi-dedicated-5v-eco]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe-or-validate:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0.5
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Preparar KiCad
        run: |
          mkdir -p "$HOME/.config/kicad/10.0"
          cp /usr/share/kicad/template/sym-lib-table "$HOME/.config/kicad/10.0/sym-lib-table"
          cp /usr/share/kicad/template/fp-lib-table "$HOME/.config/kicad/10.0/fp-lib-table"
      - name: Probe previo 5V_HMI
        if: ${{ !hashFiles('hardware/hmi_power_eco.json') }}
        run: python3 tools/probe_hmi_power_eco.py
      - name: Gate ECO materializado
        if: ${{ hashFiles('hardware/hmi_power_eco.json') != '' }}
        run: |
          python3 tools/validate_hmi_power_eco.py
          python3 tools/validate_hmi_system.py
          python3 tools/validate_z2_production.py
          python3 tools/validate_routing_batches.py
          kicad-cli pcb drc kicad/NFB_Insight_PCBA_v2.kicad_pcb --format json --output /tmp/hmi_power_drc.json --severity-all
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/hmi_power_drc.json',encoding='utf-8'))
          e=[v for v in d.get('violations',[]) if v.get('severity')=='error']
          if e: raise SystemExit(f'DRC errors={len(e)} primero={e[0]}')
          print('DRC_ERRORS=0 UNCONNECTED=',len(d.get('unconnected_items',[])))
          PY
