name: PR24 ECO load-cell testpoints Z2

on:
  push:
    branches: [agent/pr24-z2-loadcell-tp-eco]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  eco:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0.5
      options: --user root
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Inicializar KiCad y git
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p "$HOME/.config/kicad/10.0"
          cp /usr/share/kicad/template/sym-lib-table "$HOME/.config/kicad/10.0/sym-lib-table"
          cp /usr/share/kicad/template/fp-lib-table "$HOME/.config/kicad/10.0/fp-lib-table"
      - name: Regenerar base + ECOs
        run: |
          python3 tools/generate_pr17_placement_manifest.py
          python3 tools/apply_z3_buck_placement_eco.py
          cp hardware/placement_manifest.json /tmp/base_pr22.json
          python3 tools/apply_z2_loadcell_tp_eco.py
          python3 tools/validate_z2_loadcell_tp_eco.py /tmp/base_pr22.json
      - name: Materializar y validar
        run: |
          python3 tools/materialize_pr17_pcb.py
          python3 tools/validate_pr17_placement.py
          kicad-cli pcb drc kicad/NFB_Insight_PCBA_v2.kicad_pcb --format json --output /tmp/pr24_drc.json --severity-all
          cp /tmp/pr24_drc.json hardware/pr24_eco_drc.json
          python3 tools/validate_pr17_drc.py /tmp/pr24_drc.json
      - name: Confirmar modo solo lectura
        run: echo "PR24 valida semánticamente; CI no escribe en la rama."
      - name: Guardar artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr24-loadcell-tp-eco
          path: |
            hardware/placement_manifest.json
            hardware/pr24_eco_drc.json
            kicad/NFB_Insight_PCBA_v2.kicad_pcb
