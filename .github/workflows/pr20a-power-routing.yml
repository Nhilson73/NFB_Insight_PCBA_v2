name: PR20A power routing
on:
  push:
    branches: [agent/pr20a-power-routing]
    paths:
      - 'tools/run_pr20a_power_router_v8_dirty_stage.py'
      - 'tools/run_pr20a_power_router_v8.py'
      - 'tools/materialize_pr20a_power_router.py'
      - '.github/workflows/pr20a-power-routing.yml'
permissions:
  contents: read
jobs:
  dirty-stage:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0.5
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Preparar KiCad
        run: |
          mkdir -p "$HOME/.config/kicad/10.0"
          cp /usr/share/kicad/template/sym-lib-table "$HOME/.config/kicad/10.0/sym-lib-table"
          cp /usr/share/kicad/template/fp-lib-table "$HOME/.config/kicad/10.0/fp-lib-table"
      - name: Materializar etapa dirty/output
        run: python3 tools/run_pr20a_power_router_v8_dirty_stage.py
      - name: DRC dirty/output
        run: kicad-cli pcb drc kicad/NFB_Insight_PCBA_v2.kicad_pcb --format json --output /tmp/pr20a_dirty.json --severity-all
      - name: Resumen seis nets
        run: |
          python3 - <<'PY'
          import json,re
          from collections import Counter
          p=json.load(open('/tmp/pr20a_dirty.json',encoding='utf-8'))
          target=['12V_IN_RAW','12V_PROTECTED','12V_ACT','PUMP_OUT1','PUMP_OUT2','CO2_SOL_POS']
          e=[v for v in p.get('violations',[]) if v.get('severity')=='error']
          leaks={n:0 for n in target}
          for u in p.get('unconnected_items',[]):
              s=json.dumps(u,ensure_ascii=False)
              for n in target:
                  if re.search(rf'(?<![A-Za-z0-9_]){re.escape(n)}(?![A-Za-z0-9_])',s):leaks[n]+=1
          print('ERRORS',len(e),dict(Counter(v.get('type','?') for v in e)))
          print('UNCONNECTED',len(p.get('unconnected_items',[])),'TARGET',leaks)
          if e:
              print(json.dumps(e[:20],ensure_ascii=False,indent=2));raise SystemExit(1)
          if any(leaks.values()):raise SystemExit('ERROR: etapa dirty no 6/6')
          PY
